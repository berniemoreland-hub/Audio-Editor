name: Build and Release VOX-BERNIE for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main.js'
      - 'preload.js'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VOX-BERNIE-Windows
          path: dist/VOX-BERNIE.Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Read app version
        id: version
        shell: powershell
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release for updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: VOX-BERNIE v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/VOX-BERNIE.Setup.exe
            dist/latest.yml
